name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --uac-admin
          --name ZapretGUI --icon assets/icon.ico
          --add-data "assets/icon.ico;assets" --hidden-import pystray._win32
          --collect-all customtkinter zapret_gui.py

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ZapretGUI.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ZapretGUI.exe" | Out-File -Encoding ascii dist/ZapretGUI.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI
          path: |
            dist/ZapretGUI.exe
            dist/ZapretGUI.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZapretGUI.exe
            dist/ZapretGUI.exe.sha256
          generate_release_notes: true
